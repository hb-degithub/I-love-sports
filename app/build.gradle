plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vloc.motion'
    compileSdk 35

    // VLog 依赖 BuildConfig.DEBUG 区分 debug/release；AGP 8 默认不生成该类，必须显式打开。
    buildFeatures {
        buildConfig true
    }
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.vloc.motion"
        minSdk 26
        targetSdk 34
        versionCode 84
        versionName "0.46.0"
        resourceConfigurations += ['zh', 'en']
    }

    // 调试签名：本地有自备 debug.keystore 就用它，否则回退到 Android 默认 debug 签名
    // （CI/新克隆的仓库里没有 .toolchain/keystore，必须能正常构建）
    def localDebugKeystore = rootProject.file('.toolchain/keystore/debug.keystore')
    signingConfigs {
        if (localDebugKeystore.exists()) {
            debug {
                storeFile localDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (localDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 双 API 兼容骨架用：libxposed API 102 仅编译期需要（运行期由 LSPosed 提供）。
    compileOnly files('libs/libxposed-api-102.jar')
    // libxposed「应用侧」服务 API（XposedServiceHelper / XposedService / RemotePreferences）：
    // 与上面的 api jar 不同，这是运行时也要的类（App 进程内自己跑），所以用 implementation
    // 打进 APK。来源：/home/hb/隐私跳转防护模块/android/third_party/libxposed-service 的
    // bundleLibRuntimeToJarRelease/classes.jar（102.0.0，已完成编译产物，sha256
    // 973cbbac6c6bb34c17058531d241e4d2a64dcf23faf007e20139f070fcea350d）。
    implementation files('libs/libxposed-service.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    // LSPosed 模块入口：仅编译期依赖，运行时由 LSPosed 提供
    compileOnly files('libs/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
