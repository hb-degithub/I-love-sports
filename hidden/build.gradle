plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vloc.motion.hidden'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.vloc.motion.hidden"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.4.0"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('.toolchain/keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    // Xposed 模块只需 compileOnly 依赖，运行时由 LSPosed 提供
    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    compileOnly files('libs/xposed-api-82.jar')
}
