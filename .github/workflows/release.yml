name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（例如 v0.32.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          ( yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 ) || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-release-${{ runner.os }}-

      - name: Generate debug keystore
        run: |
          mkdir -p .toolchain/keystore
          keytool -genkeypair -v \
            -keystore .toolchain/keystore/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null

      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Build Zygisk sensor module
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build zip > /dev/null
          bash zygisk/build.sh
          cp zygisk/out/vloc-zygisk.zip "vloc-zygisk-${GITHUB_REF_NAME}.zip"
          ls -la vloc-zygisk*.zip

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 用 release 构建 + 显式签名：debug 构建带 debuggable=true，
      # 对模拟定位/反检测类应用是可被目标 App 直接检测到的特征，不能作为分发产物。
      # 若仓库配置了 KEYSTORE_B64（base64 的 keystore）则用它，保证与历史包同一签名；
      # 否则回退到本次生成的 debug keystore（签名会与历史包不同，需卸载重装）。
      - name: Sign release APK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          echo "build-tools: $BT"
          UNSIGNED="$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)"
          echo "unsigned: $UNSIGNED"
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "使用 Secrets 中的 keystore"
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"
          else
            echo "未配置 KEYSTORE_B64，回退到本次生成的 debug keystore"
            KS=".toolchain/keystore/debug.keystore"
            if [ ! -f "$KS" ]; then
              mkdir -p .toolchain/keystore
              keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" > /dev/null
            fi
          fi
          ALIAS="${{ secrets.KEY_ALIAS || 'androiddebugkey' }}"
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD || 'android' }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD || 'android' }}"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release-signed.apk

      - name: Prepare release asset
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)"
          APK="app/build/outputs/apk/release/app-release-signed.apk"
          OUT="virtual-motion-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "ASSET=$OUT" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "版本号：$VERSION / 标签：$TAG / 产物：$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -la "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 虚拟运动（root 版）${{ env.TAG }}

            > ⛔ **许可：PolyForm Noncommercial 1.0.0 —— 禁止任何商业用途**（见 LICENSE / LICENSE-ZH.md）
            > 🚫 **仅供学习、研究与自有设备技术验证；严禁打卡作弊、位置欺诈、绕过风控等违规违法用途**（见 DISCLAIMER.md）

            本项目专注于**虚拟定位与运动模拟**（相机/摄像头相关功能已移除）。

            ### 安装
            ```bash
            adb install -r virtual-motion-*.apk
            ```
            - 需要 root（Magisk / KernelSU / APatch）；隐藏模块需 LSPosed 并勾选作用域
            - 这是 **release 构建（非 debuggable）** + debug 签名的测试产物；若与已装版本签名不一致需先卸载

            ### 传感器系统级注入（可选）
            附件 `vloc-zygisk-*.zip` 是 **Magisk 模块**：刷入后在 App 里开启「系统级注入」，
            所有 App 的计步/加速度/陀螺仪/姿态都会被接管（无需 LSPosed 作用域）。
            详见 `docs/zygisk-sensors.md`。刷入有风险，请先确认能用 Magisk 卸载恢复。

            ### 校验
            见附带的 `.sha256` 文件。
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            vloc-zygisk*.zip
          fail_on_unmatched_files: true
