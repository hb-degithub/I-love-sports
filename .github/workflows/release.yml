name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（例如 v0.32.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          ( yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 ) || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-release-${{ runner.os }}-

      - name: Generate debug keystore
        run: |
          mkdir -p .toolchain/keystore
          keytool -genkeypair -v \
            -keystore .toolchain/keystore/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)"
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          OUT="virtual-motion-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "ASSET=$OUT" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "版本号：$VERSION / 标签：$TAG / 产物：$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -la "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 虚拟运动（root 版）${{ env.TAG }}

            > ⛔ **许可：PolyForm Noncommercial 1.0.0 —— 禁止任何商业用途**（见 LICENSE / LICENSE-ZH.md）
            > 🚫 **仅供学习、研究与自有设备技术验证；严禁打卡作弊、位置欺诈、绕过风控等违规违法用途**（见 DISCLAIMER.md）

            本项目专注于**虚拟定位与运动模拟**（相机/摄像头相关功能已移除）。

            ### 安装
            ```bash
            adb install -r virtual-motion-*.apk
            ```
            - 需要 root（Magisk / KernelSU / APatch）；隐藏模块需 LSPosed 并勾选作用域
            - 这是 **debug 签名** 的构建产物，仅供测试

            ### 校验
            见附带的 `.sha256` 文件。
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          fail_on_unmatched_files: true
