name: Zygisk Module

on:
  push:
    branches: [ master, main ]
    paths:
      - 'zygisk/**'
      - '.github/workflows/zygisk.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'zygisk/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK" ]; then
            echo "::error::runner 上没有 NDK"; exit 1
          fi
          echo "使用 NDK: $NDK"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Install cmake / ninja / zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build zip unzip

      - name: Build Zygisk module
        run: bash zygisk/build.sh

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: vloc-zygisk-module
          path: zygisk/out/vloc-zygisk.zip
          if-no-files-found: error
